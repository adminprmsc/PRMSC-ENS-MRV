// Avoid Gradle subprocess `node` lookups (netinfo, autolinking) when `node` is not on PATH
// (common with Homebrew + IDE/Gradle daemon). See react-native-netinfo android/build.gradle.
ext {
    REACT_NATIVE_NODE_MODULES_DIR = file("${rootDir}/../node_modules/react-native")
}

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// @react-native-async-storage/async-storage 3.x resolves storage-android from a local Maven repo (not on Maven Central).
allprojects {
    repositories {
        maven {
            url("${rootDir}/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}
